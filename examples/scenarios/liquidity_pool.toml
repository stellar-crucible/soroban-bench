# Automated Market Maker (AMM) Liquidity Stress Benchmark
name = "liquidity-pool-stress"
description = "Simulate liquidity seeding, high-frequency swaps, and LP withdrawals"

[[steps]]
name = "seed-initial-liquidity"
contract_method = "deposit_liquidity"
iterations = 25
expected_max_cpu = 1800000
expected_max_mem = 95000

[[steps]]
name = "continuous-swaps"
contract_method = "swap_tokens"
iterations = 250
expected_max_cpu = 1250000
expected_max_mem = 60000

[[steps]]
name = "lp-share-withdrawal"
contract_method = "withdraw_liquidity"
iterations = 25
expected_max_cpu = 1600000
expected_max_mem = 85000
